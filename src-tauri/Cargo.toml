[package]
name = "anchovy"
version = "0.1.0"
description = "Local meeting notes for Apple Silicon Macs"
authors = ["Sailvai"]
license = "MIT"
repository = "https://github.com/sailvai/anchovy"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "anchovy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Model downloads. native-tls uses the macOS Security framework, so no bundled
# certificate list or crypto library.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.10"
libc = "0.2"
# Move to Trash and Show in Finder, and recording through Core Audio (plan
# step 4a). objc2 is already in the tree through Tauri.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSObject", "NSSet", "NSString", "NSURL", "NSUUID", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSRunningApplication", "NSApplication"] }
# The microphone permission (plan step 3): AVCaptureDevice is the public API
# that reports and asks for it.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
# The meeting prompt's notification with Record and Not now (plan step 7).
# Tauri's notification plugin does not offer buttons on macOS.
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
# Small quality (plan step 8): the macOS AAC encoder and decoder through
# ExtAudioFile. No other encoder or decoder is used.
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AudioFile", "ExtendedAudioFile", "objc2-core-audio-types", "objc2-core-foundation"] }
# A lock-free single-producer ring buffer so the audio callback never locks or
# allocates.
rtrb = "0.4"
# Transcription and summaries on this Mac (plan step 6). Metal runs the models
# on the GPU; mtmd feeds audio to Qwen3-ASR. Default features are off so the
# build does not pick up OpenMP from outside macOS.
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = ["metal", "mtmd"] }
# Model output arrives in token pieces that may split a UTF-8 character.
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
