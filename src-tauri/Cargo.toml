[package]
name = "anchovy"
version = "0.1.0"
description = "Local meeting notes for Apple Silicon Macs"
authors = ["Sailvai"]
license = "MIT"
repository = "https://github.com/sailvai/anchovy"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "anchovy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
