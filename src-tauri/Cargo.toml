[package]
name = "anchovy"
version = "0.1.0"
description = "Local meeting notes for Apple Silicon Macs"
authors = ["Sailvai"]
license = "MIT"
repository = "https://github.com/sailvai/anchovy"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "anchovy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Model downloads. native-tls uses the macOS Security framework, so no bundled
# certificate list or crypto library.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.10"
libc = "0.2"
# Recording: Core Audio through objc2 (plan step 4a), and a lock-free
# single-producer ring buffer so the audio callback never locks or allocates.
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
rtrb = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
